plugins {
    id 'java'
}

group = 'com.carpetplayers'
version = '1.21.11-1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly files('libs/paper-api-1.21.11.jar')
    compileOnly files('libs/paper-server-1.21.11.jar')
    // ViaVersion API — deteksi versi protokol client (Stage 2)
    compileOnly files('libs/ViaVersion-5.11.0.jar')
    // Paper 1.21.x memisahkan library runtime dari server jar (tidak fat jar).
    // Libraries ini di-extract paperclip ke folder ini; hanya dibutuhkan saat compile.
    compileOnly fileTree(dir: 'patchwork/libraries', include: '**/*.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    inputs.property('version', project.version)
    filesMatching('plugin.yml') {
        expand('version': project.version)
    }
}

jar {
    archiveFileName = 'carpetplayers-1.21.11.jar'
}
