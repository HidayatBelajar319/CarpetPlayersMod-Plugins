plugins {
    id 'java'
}

group = 'com.carpetplayers'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // Paper 1.16.5 server jar hasil ekstrak paperclip (paper-server-1.16.5.jar):
    // berisi paper-api + CraftBukkit + NMS v1_16_R3. Cukup satu jar untuk kompilasi.
    compileOnly files('libs/paper-server-1.16.5.jar')
    // Gson dipakai untuk config providers.json; disediakan oleh server Paper
    // saat runtime, jadi cukup compileOnly.
    compileOnly 'com.google.code.gson:gson:2.8.9'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}
